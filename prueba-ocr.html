<!DOCTYPE html><html><head><meta charset="utf-8"><title>esperando</title></head><body>
<pre id="salida">...</pre>
<script src="ocr/tesseract.min.js"></script>
<script>
(async function(){
  const salida = document.getElementById('salida');
  try{
    const t0 = Date.now();
    const w = await Tesseract.createWorker('spa', 3, {
      workerPath:'ocr2/worker.min.js', corePath:'ocr2/', langPath:'ocr2/'
    });
    const r = (await w.recognize('prueba-foto.png')).data;
    await w.terminate();
    salida.textContent = '=== MODELO COMPLETO (conf ' + Math.round(r.confidence) + ', ' +
      Math.round((Date.now()-t0)/1000) + 's) ===\n' + r.text;
    document.title = 'LISTO';
  }catch(e){ document.title = 'ERROR ' + (e && e.message || e); salida.textContent = String(e && e.stack || e); }
})();
</script></body></html>
