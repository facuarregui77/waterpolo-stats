<!DOCTYPE html>
<!-- ==========================================================================
     DIBUJO DEL ICONO DE LA APP
     Una Mikasa de waterpolo: amarilla, con los gajos azul y rosa asomando a los
     costados, el granulado de la superficie y las olitas del agua.
     De acá salen icon-512.png e icon-180.png. Para rehacerlos, abrir este
     archivo en Chrome y sacarle una captura del tamaño que corresponda, o con:
       chrome --headless --hide-scrollbars --window-size=512,512
              --screenshot=icon-512.png icono-pelota.html
     Para el de 180 se cambia width/height del <svg> a 180 y se engordan las
     costuras y la espuma, para que se sigan viendo cuando queda chiquito.
     ========================================================================== -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4f92"/>
      <stop offset="0.55" stop-color="#0f7fc0"/>
      <stop offset="1" stop-color="#14a9da"/>
    </linearGradient>
    <radialGradient id="cuero" cx="0.36" cy="0.30" r="0.80">
      <stop offset="0" stop-color="#ffdc5e"/>
      <stop offset="0.45" stop-color="#f7c422"/>
      <stop offset="0.85" stop-color="#e8a90d"/>
      <stop offset="1" stop-color="#c98a06"/>
    </radialGradient>
    <pattern id="grano" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#7a4a00" fill-opacity="0.11"/>
      <circle cx="11.5" cy="11.5" r="2.1" fill="#7a4a00" fill-opacity="0.11"/>
    </pattern>
    <radialGradient id="brillo" cx="0.34" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="volumen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a3800" stop-opacity="0.30"/>
    </radialGradient>
    <clipPath id="bola"><circle cx="256" cy="243" r="175"/></clipPath>
    <clipPath id="arriba"><path d="M0,0 H512 V196 C 400,246 112,246 0,196 Z"/></clipPath>
    <clipPath id="abajo"><path d="M0,196 C 112,246 400,246 512,196 V512 H0 Z"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#agua)"/>
  <path d="M0,392 C 55,368 105,410 165,392 C 225,374 275,414 335,396 C 395,378 450,414 512,394 L512,512 L0,512 Z"
        fill="#0a5e9e" opacity="0.55"/>

  <!-- cuerpo amarillo -->
  <circle cx="256" cy="243" r="175" fill="url(#cuero)"/>

  <!-- gajos de los costados: azul y rosa, como la pelota de verdad -->
  <g clip-path="url(#bola)">
    <g clip-path="url(#arriba)">
      <path d="M256,68 A175,175 0 0,0 256,418 A139,175 0 0,1 256,68 Z" fill="#1a5fa8"/>
      <path d="M256,68 A175,175 0 0,1 256,418 A139,175 0 0,0 256,68 Z" fill="#e8559a"/>
    </g>
    <g clip-path="url(#abajo)">
      <path d="M256,68 A175,175 0 0,0 256,418 A139,175 0 0,1 256,68 Z" fill="#e8559a"/>
      <path d="M256,68 A175,175 0 0,1 256,418 A139,175 0 0,0 256,68 Z" fill="#1a5fa8"/>
    </g>
    <!-- el amarillo vuelve al frente, dejando los gajos sólo en los bordes -->
    <ellipse cx="256" cy="243" rx="139" ry="175" fill="url(#cuero)"/>
    <circle cx="256" cy="243" r="175" fill="url(#grano)"/>
  </g>

  <!-- costuras de los paneles -->
  <g clip-path="url(#bola)" fill="none" stroke="#c08c0a" stroke-width="3.5" opacity="0.5">
    <ellipse cx="256" cy="243" rx="139" ry="175"/>
    <ellipse cx="256" cy="243" rx="96" ry="175"/>
    <ellipse cx="256" cy="243" rx="45" ry="175"/>
    <line x1="256" y1="68" x2="256" y2="418"/>
  </g>

  <circle cx="256" cy="243" r="175" fill="url(#volumen)"/>
  <circle cx="256" cy="243" r="175" fill="url(#brillo)"/>
  <circle cx="256" cy="243" r="175" fill="none" stroke="#a06f04" stroke-width="5" opacity="0.45"/>

  <!-- olitas por delante -->
  <path d="M0,424 C 58,398 112,442 172,424 C 232,406 282,446 342,428 C 402,410 456,444 512,424 L512,512 L0,512 Z"
        fill="#0f86c6"/>
  <path d="M0,424 C 58,398 112,442 172,424 C 232,406 282,446 342,428 C 402,410 456,444 512,424"
        fill="none" stroke="#bfe9ff" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <path d="M0,466 C 64,444 120,486 184,468 C 248,450 300,488 364,470 C 428,452 470,484 512,468 L512,512 L0,512 Z"
        fill="#17a6d6"/>
  <path d="M0,466 C 64,444 120,486 184,468 C 248,450 300,488 364,470 C 428,452 470,484 512,468"
        fill="none" stroke="#d9f4ff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M58,392 C 76,384 92,398 110,390" fill="none" stroke="#cfeeff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <path d="M404,398 C 422,390 438,404 456,396" fill="none" stroke="#cfeeff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
</svg>
</body></html>
