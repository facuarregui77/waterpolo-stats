<!DOCTYPE html>
<!-- ==========================================================================
     DIBUJO DEL ICONO DE LA APP — pelota de waterpolo flotando en el agua
     De acá salen icon-512.png e icon-180.png. Para rehacerlos, abrir este
     archivo en Chrome y sacarle una captura del tamaño que corresponda, o con:
       chrome --headless --hide-scrollbars --window-size=512,512
              --screenshot=icon-512.png icono-pelota.html
     Para el de 180 se cambia width/height del <svg> a 180 y se engordan las
     costuras y la espuma, para que se sigan viendo cuando queda chiquito.
     ========================================================================== -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4f92"/>
      <stop offset="0.55" stop-color="#0f7fc0"/>
      <stop offset="1" stop-color="#14a9da"/>
    </linearGradient>
    <radialGradient id="cuero" cx="0.36" cy="0.30" r="0.78">
      <stop offset="0" stop-color="#ffe169"/>
      <stop offset="0.45" stop-color="#fcc321"/>
      <stop offset="0.82" stop-color="#f0a80c"/>
      <stop offset="1" stop-color="#cf8505"/>
    </radialGradient>
    <pattern id="grano" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.4" fill="#8a5400" fill-opacity="0.13"/>
      <circle cx="13" cy="13" r="2.4" fill="#8a5400" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="brillo" cx="0.33" cy="0.26" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bola"><circle cx="256" cy="243" r="175"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#agua)"/>

  <!-- olitas que quedan detrás de la pelota -->
  <path d="M0,392 C 55,368 105,410 165,392 C 225,374 275,414 335,396 C 395,378 450,414 512,394 L512,512 L0,512 Z"
        fill="#0a5e9e" opacity="0.55"/>

  <!-- la pelota, flotando -->
  <circle cx="256" cy="243" r="175" fill="url(#cuero)"/>
  <circle cx="256" cy="243" r="175" fill="url(#grano)"/>
  <g clip-path="url(#bola)" fill="none" stroke="#a35f00" stroke-width="10" stroke-linecap="round" opacity="0.92">
    <g>
      <path d="M256,68 C 352,140 352,346 256,418"/>
      <path d="M291,72 C 387,148 387,338 291,414"/>
    </g>
    <g transform="rotate(120 256 243)">
      <path d="M256,68 C 352,140 352,346 256,418"/>
      <path d="M291,72 C 387,148 387,338 291,414"/>
    </g>
    <g transform="rotate(240 256 243)">
      <path d="M256,68 C 352,140 352,346 256,418"/>
      <path d="M291,72 C 387,148 387,338 291,414"/>
    </g>
  </g>
  <circle cx="256" cy="243" r="175" fill="url(#brillo)"/>
  <circle cx="256" cy="243" r="175" fill="none" stroke="#9a5a00" stroke-width="7" opacity="0.55"/>

  <!-- olitas que pasan por delante: la pelota queda metida en el agua -->
  <path d="M0,424 C 58,398 112,442 172,424 C 232,406 282,446 342,428 C 402,410 456,444 512,424 L512,512 L0,512 Z"
        fill="#0f86c6"/>
  <path d="M0,424 C 58,398 112,442 172,424 C 232,406 282,446 342,428 C 402,410 456,444 512,424"
        fill="none" stroke="#bfe9ff" stroke-width="9" stroke-linecap="round" opacity="0.75"/>

  <path d="M0,466 C 64,444 120,486 184,468 C 248,450 300,488 364,470 C 428,452 470,484 512,468 L512,512 L0,512 Z"
        fill="#17a6d6"/>
  <path d="M0,466 C 64,444 120,486 184,468 C 248,450 300,488 364,470 C 428,452 470,484 512,468"
        fill="none" stroke="#d9f4ff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- espuma suelta a los costados -->
  <path d="M58,392 C 76,384 92,398 110,390" fill="none" stroke="#cfeeff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <path d="M404,398 C 422,390 438,404 456,396" fill="none" stroke="#cfeeff" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
</svg>
</body></html>
