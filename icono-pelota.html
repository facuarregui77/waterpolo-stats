<!DOCTYPE html>
<!-- ==========================================================================
     DIBUJO DEL ICONO DE LA APP — pelota de waterpolo
     De acá salen icon-512.png e icon-180.png. Para rehacerlos, abrir este
     archivo en Chrome y sacarle una captura del tamaño que corresponda, o con:
       chrome --headless --hide-scrollbars --window-size=512,512
              --screenshot=icon-512.png icono-pelota.html
     Para el de 180 se cambia width/height del <svg> a 180 y se engordan las
     costuras (stroke-width 14) para que se sigan viendo en chico.
     ========================================================================== -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
svg{display:block}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4f92"/>
      <stop offset="0.55" stop-color="#0f7fc0"/>
      <stop offset="1" stop-color="#14a9da"/>
    </linearGradient>
    <radialGradient id="cuero" cx="0.36" cy="0.30" r="0.78">
      <stop offset="0" stop-color="#ffe169"/>
      <stop offset="0.45" stop-color="#fcc321"/>
      <stop offset="0.82" stop-color="#f0a80c"/>
      <stop offset="1" stop-color="#cf8505"/>
    </radialGradient>
    <pattern id="grano" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.4" fill="#8a5400" fill-opacity="0.13"/>
      <circle cx="13" cy="13" r="2.4" fill="#8a5400" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="brillo" cx="0.33" cy="0.26" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bola"><circle cx="256" cy="262" r="182"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#agua)"/>

  <!-- sombra en el agua -->
  <ellipse cx="256" cy="455" rx="150" ry="26" fill="#062f57" opacity="0.28"/>

  <!-- pelota -->
  <circle cx="256" cy="262" r="182" fill="url(#cuero)"/>
  <circle cx="256" cy="262" r="182" fill="url(#grano)"/>

  <!-- costuras: tres pares de gajos, como la pelota de verdad -->
  <g clip-path="url(#bola)" fill="none" stroke="#a35f00" stroke-width="10" stroke-linecap="round" opacity="0.92">
    <g>
      <path d="M256,80 C 356,155 356,369 256,444"/>
      <path d="M292,84 C 392,163 392,361 292,440"/>
    </g>
    <g transform="rotate(120 256 262)">
      <path d="M256,80 C 356,155 356,369 256,444"/>
      <path d="M292,84 C 392,163 392,361 292,440"/>
    </g>
    <g transform="rotate(240 256 262)">
      <path d="M256,80 C 356,155 356,369 256,444"/>
      <path d="M292,84 C 392,163 392,361 292,440"/>
    </g>
  </g>

  <circle cx="256" cy="262" r="182" fill="url(#brillo)"/>
  <circle cx="256" cy="262" r="182" fill="none" stroke="#9a5a00" stroke-width="7" opacity="0.55"/>
</svg>
</body></html>
